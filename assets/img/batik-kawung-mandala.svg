<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Champagne Gold Gradient -->
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2de" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#e6ca9c" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#d4b278" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#b89354" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Soft Rose / Blush Gradient -->
    <linearGradient id="rosePetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae1dc" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d88c9a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#c47382" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="softFloralGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blooming Floral Petal Element -->
    <g id="floralPetal">
      <!-- Petal Body -->
      <path d="M 150 150 C 115 95 125 40 150 15 C 175 40 185 95 150 150 Z" 
            fill="url(#rosePetalGrad)" stroke="url(#champagneGold)" stroke-width="1.2" opacity="0.6"/>
      <!-- Inner Vein / Delicate Spine -->
      <path d="M 150 25 Q 142 85 150 140" fill="none" stroke="url(#champagneGold)" stroke-width="0.9" stroke-dasharray="2,3"/>
      <!-- Flower Pearl Dewdrops -->
      <circle cx="140" cy="55" r="2.2" fill="#fff9eb"/>
      <circle cx="160" cy="55" r="2.2" fill="#fff9eb"/>
      <circle cx="136" cy="85" r="2" fill="#e6ca9c"/>
      <circle cx="164" cy="85" r="2" fill="#e6ca9c"/>
      <circle cx="150" cy="40" r="2.8" fill="#d4b278"/>
    </g>

    <!-- Small Floral Bud Flory -->
    <g id="floralBud">
      <path d="M 150 85 C 142 95 145 108 150 115 C 155 108 158 95 150 85 Z" fill="url(#champagneGold)" opacity="0.85"/>
      <circle cx="150" cy="115" r="2.5" fill="#fff4e0"/>
    </g>
  </defs>

  <g filter="url(#softFloralGlow)">
    <!-- Outer Pearl Beaded Halo -->
    <circle cx="150" cy="150" r="144" fill="none" stroke="url(#champagneGold)" stroke-width="1" opacity="0.5"/>
    <circle cx="150" cy="150" r="138" fill="none" stroke="url(#champagneGold)" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.75"/>
    <circle cx="150" cy="150" r="132" fill="none" stroke="url(#rosePetalGrad)" stroke-width="0.8" opacity="0.6"/>

    <!-- 12 Radiating Flower Petals in Circular Mandala -->
    <use href="#floralPetal" transform="rotate(0 150 150)"/>
    <use href="#floralPetal" transform="rotate(30 150 150)"/>
    <use href="#floralPetal" transform="rotate(60 150 150)"/>
    <use href="#floralPetal" transform="rotate(90 150 150)"/>
    <use href="#floralPetal" transform="rotate(120 150 150)"/>
    <use href="#floralPetal" transform="rotate(150 150 150)"/>
    <use href="#floralPetal" transform="rotate(180 150 150)"/>
    <use href="#floralPetal" transform="rotate(210 150 150)"/>
    <use href="#floralPetal" transform="rotate(240 150 150)"/>
    <use href="#floralPetal" transform="rotate(270 150 150)"/>
    <use href="#floralPetal" transform="rotate(300 150 150)"/>
    <use href="#floralPetal" transform="rotate(330 150 150)"/>

    <!-- Interstitial Floral Buds -->
    <use href="#floralBud" transform="rotate(15 150 150)"/>
    <use href="#floralBud" transform="rotate(45 150 150)"/>
    <use href="#floralBud" transform="rotate(75 150 150)"/>
    <use href="#floralBud" transform="rotate(105 150 150)"/>
    <use href="#floralBud" transform="rotate(135 150 150)"/>
    <use href="#floralBud" transform="rotate(165 150 150)"/>
    <use href="#floralBud" transform="rotate(195 150 150)"/>
    <use href="#floralBud" transform="rotate(225 150 150)"/>
    <use href="#floralBud" transform="rotate(255 150 150)"/>
    <use href="#floralBud" transform="rotate(285 150 150)"/>
    <use href="#floralBud" transform="rotate(315 150 150)"/>
    <use href="#floralBud" transform="rotate(345 150 150)"/>

    <!-- Inner Blossom Rose Floret -->
    <circle cx="150" cy="150" r="48" fill="#fff5f2" fill-opacity="0.3" stroke="url(#champagneGold)" stroke-width="1.5"/>
    <circle cx="150" cy="150" r="36" fill="url(#rosePetalGrad)" fill-opacity="0.4" stroke="url(#champagneGold)" stroke-width="1" stroke-dasharray="3,3"/>
    
    <!-- Rose Pistil / Center Core -->
    <circle cx="150" cy="150" r="16" fill="url(#champagneGold)" opacity="0.85"/>
    <circle cx="150" cy="150" r="8" fill="#ffffff"/>
    <circle cx="150" cy="150" r="3" fill="#c47382"/>
  </g>
</svg>
