<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="roseCornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf3e2"/>
      <stop offset="50%" stop-color="#e6ca9c"/>
      <stop offset="100%" stop-color="#d4b278"/>
    </linearGradient>
    <linearGradient id="roseBudPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe4de"/>
      <stop offset="60%" stop-color="#d88c9a"/>
      <stop offset="100%" stop-color="#c47382"/>
    </linearGradient>
  </defs>

  <!-- Elegant Curving Floral Vine -->
  <path d="M 6 74 C 6 36 36 6 74 6" fill="none" stroke="url(#roseCornerGold)" stroke-width="1.8"/>
  <path d="M 6 60 C 6 30 30 6 60 6" fill="none" stroke="url(#roseCornerGold)" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Rosebud at Corner Apex -->
  <g transform="translate(14, 14)">
    <circle cx="0" cy="0" r="7" fill="url(#roseBudPink)" opacity="0.95"/>
    <path d="M -5 -3 Q 0 4 5 -3 Q 0 -7 -5 -3 Z" fill="#fff5f2" opacity="0.6"/>
    <!-- Small Leaf Wings -->
    <path d="M -2 4 Q -10 10 -4 14 Q 2 12 -2 4 Z" fill="url(#roseCornerGold)" opacity="0.85"/>
    <path d="M 4 -2 Q 10 -10 14 -4 Q 12 2 4 -2 Z" fill="url(#roseCornerGold)" opacity="0.85"/>
  </g>

  <!-- Delicate Leaves along Vine -->
  <path d="M 6 42 Q 14 38 18 46 Q 10 48 6 42 Z" fill="url(#roseCornerGold)" opacity="0.8"/>
  <path d="M 42 6 Q 38 14 46 18 Q 48 10 42 6 Z" fill="url(#roseCornerGold)" opacity="0.8"/>

  <!-- Small Rose Blossom Accent -->
  <circle cx="6" cy="74" r="3" fill="url(#roseBudPink)"/>
  <circle cx="74" cy="6" r="3" fill="url(#roseBudPink)"/>
  <circle cx="6" cy="6" r="3.5" fill="url(#roseCornerGold)"/>
</svg>
