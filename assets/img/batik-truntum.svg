<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldTruntum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4db"/>
      <stop offset="40%" stop-color="#dfc181"/>
      <stop offset="100%" stop-color="#c5a059"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pola Bintang Truntum (Bunga Tabur) -->
  <g filter="url(#glow)">
    <!-- 8 Kelopak Utama Lancip (Khas Truntum Keraton) -->
    <path d="M 60 10 L 64 45 L 85 25 L 75 52 L 110 60 L 75 68 L 85 95 L 64 75 L 60 110 L 56 75 L 35 95 L 45 68 L 10 60 L 45 52 L 35 25 L 56 45 Z" 
          fill="url(#goldTruntum)" opacity="0.85"/>

    <!-- Lingkaran Inti Bertitik Cecek -->
    <circle cx="60" cy="60" r="18" fill="#21363c" stroke="url(#goldTruntum)" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="12" fill="none" stroke="url(#goldTruntum)" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="60" cy="60" r="5" fill="url(#goldTruntum)"/>
    <circle cx="60" cy="60" r="2" fill="#ffffff"/>

    <!-- 4 Titik Cahaya Emas di Sudut Diagonal -->
    <circle cx="60" cy="32" r="2" fill="#ffffff"/>
    <circle cx="60" cy="88" r="2" fill="#ffffff"/>
    <circle cx="32" cy="60" r="2" fill="#ffffff"/>
    <circle cx="88" cy="60" r="2" fill="#ffffff"/>
  </g>
</svg>
