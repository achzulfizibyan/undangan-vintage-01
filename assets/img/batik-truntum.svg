<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="roseGoldFloral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f2"/>
      <stop offset="35%" stop-color="#f7d6d0"/>
      <stop offset="70%" stop-color="#d88c9a"/>
      <stop offset="100%" stop-color="#e6ca9c"/>
    </linearGradient>
    <filter id="petalGlow">
      <feGaussianBlur stdDeviation="1.8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 5-Petal Blooming Cherry / Rose Blossom -->
  <g filter="url(#petalGlow)">
    <!-- 5 Heart-shaped Rose Petals -->
    <path d="M 60 60 C 50 40 40 18 60 12 C 80 18 70 40 60 60 Z" fill="url(#roseGoldFloral)" opacity="0.9"/>
    <path d="M 60 60 C 78 48 102 38 105 58 C 98 76 76 68 60 60 Z" fill="url(#roseGoldFloral)" opacity="0.85"/>
    <path d="M 60 60 C 74 76 90 98 72 105 C 58 98 62 76 60 60 Z" fill="url(#roseGoldFloral)" opacity="0.9"/>
    <path d="M 60 60 C 46 76 30 98 15 88 C 18 68 42 66 60 60 Z" fill="url(#roseGoldFloral)" opacity="0.85"/>
    <path d="M 60 60 C 42 48 18 38 15 58 C 22 76 44 68 60 60 Z" fill="url(#roseGoldFloral)" opacity="0.85"/>

    <!-- Champagne Gold Stamens / Center Florets -->
    <circle cx="60" cy="60" r="10" fill="#fff5ea" stroke="#d4b278" stroke-width="1.2"/>
    <circle cx="60" cy="60" r="4.5" fill="#e6ca9c"/>
    <circle cx="60" cy="60" r="1.8" fill="#c47382"/>

    <!-- Subtle Golden Sparkles -->
    <circle cx="60" cy="38" r="1.8" fill="#ffd885"/>
    <circle cx="78" cy="52" r="1.8" fill="#ffd885"/>
    <circle cx="72" cy="74" r="1.8" fill="#ffd885"/>
    <circle cx="48" cy="74" r="1.8" fill="#ffd885"/>
    <circle cx="42" cy="52" r="1.8" fill="#ffd885"/>
  </g>
</svg>
